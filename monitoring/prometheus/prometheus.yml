global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: cancer-hospital-app
    metrics_path: /metrics
    static_configs:
      - targets:
          - app:7860

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: dcgm-exporter
    static_configs:
      - targets:
          - dcgm-exporter:9400
