{% extends "base.html" %}
{% block content %}
<section class="panel">
  <div class="panel-header">
    <span class="panel-kicker">Billing</span>
    <h2>Billing and Insurance</h2>
  </div>
  <div class="table-wrap">
    <table class="data-table">
      <thead><tr><th>Invoice</th><th>Patient</th><th>Service</th><th>Amount</th><th>Status</th></tr></thead>
      <tbody>
        {% for item in items %}
          <tr>
            <td>{{ item.invoice }}</td>
            <td><a href="{{ url_for('patient_detail', patient_id=item.patient.id) }}">{{ item.patient.name }}</a></td>
            <td>{{ item.service }}</td>
            <td>{{ item.amount }}</td>
            <td>{{ item.status }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</section>
{% endblock %}
