server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /run/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    pipeline_stages:
      - docker: {}
    relabel_configs:
      - action: replace
        source_labels:
          - __meta_docker_container_label_io_kubernetes_pod_namespace
        target_label: namespace
      - action: replace
        source_labels:
          - __meta_docker_container_label_io_kubernetes_pod_name
        target_label: pod
      - action: replace
        source_labels:
          - __meta_docker_container_label_io_kubernetes_container_name
        target_label: container
      - action: replace
        source_labels:
          - __meta_docker_container_label_io_kubernetes_container_name
        target_label: service_name
      - action: replace
        source_labels:
          - __meta_docker_container_label_app_kubernetes_io_name
        regex: (.+)
        target_label: service_name
      - action: replace
        source_labels:
          - __meta_docker_container_name
        regex: /(.*)
        target_label: docker_container
      - action: replace
        source_labels:
          - __meta_docker_container_log_stream
        target_label: stream
      - action: replace
        source_labels:
          - __meta_docker_container_label_io_kubernetes_pod_node_name
        target_label: node
      - action: replace
        source_labels:
          - __meta_docker_container_id
        replacement: /var/lib/docker/containers/$1/$1-json.log
        target_label: __path__
