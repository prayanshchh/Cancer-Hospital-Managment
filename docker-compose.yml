services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cancer-hospital-app
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      HF_HOME: /opt/huggingface
      TRANSFORMERS_CACHE: /opt/huggingface
      HF_LOCAL_FILES_ONLY: "1"
      MPLBACKEND: Agg

  prometheus:
    image: prom/prometheus:latest
    container_name: cancer-hospital-prometheus
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

  grafana:
    image: grafana/grafana:latest
    container_name: cancer-hospital-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cancer-hospital-cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:latest
    container_name: cancer-hospital-dcgm
    restart: unless-stopped
    profiles:
      - gpu
    ports:
      - "9400:9400"
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

volumes:
  prometheus_data:
  grafana_data:
